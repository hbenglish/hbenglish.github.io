<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>해법영어수학전문학원 · 강의실</title>
<meta name="description" content="해법영어수학전문학원 원생을 위한 해설강의 다시보기" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  /* ── 해법영어수학전문학원 ─────────────── */
  :root{
    --blue:#3182f6;
    --blue-strong:#2272eb;
    --blue-weak:#e8f2ff;
    --ink-900:#191f28;
    --ink-800:#333d4b;
    --ink-700:#4e5968;
    --ink-500:#8b95a1;
    --ink-400:#b0b8c1;
    --line:#e5e8eb;
    --line-soft:#eef0f3;
    --surface:#f7f8fa;
    --surface-2:#f2f4f6;
    --white:#fff;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(25,31,40,.04), 0 4px 16px rgba(25,31,40,.04);
    --shadow-hover:0 6px 12px rgba(25,31,40,.06), 0 12px 28px rgba(25,31,40,.08);
    --shadow-modal:0 12px 48px rgba(25,31,40,.24);
    --ease:cubic-bezier(.25,.8,.35,1);
    --maxw:1080px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--white);
    color:var(--ink-900);
    line-height:1.5;
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px;}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

  /* ── 비밀번호 잠금 화면 ───────────────────────────────────── */
  .gate{
    position:fixed;inset:0;z-index:200;background:var(--white);
    display:flex;align-items:center;justify-content:center;padding:24px;
    transition:opacity .3s var(--ease),visibility .3s;
  }
  .gate.hidden{opacity:0;visibility:hidden;}
  .gate-card{width:100%;max-width:360px;text-align:center;}
  .gate .g-mark{
    width:54px;height:54px;border-radius:16px;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--blue),#4d9bff);display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:23px;
  }
  .gate h1{margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink-900);}
  .gate p{margin:0 0 26px;font-size:15px;color:var(--ink-500);letter-spacing:-.01em;line-height:1.55;}
  .gate .field{margin-bottom:10px;}
  .gate input{
    width:100%;font-family:inherit;font-size:16px;color:var(--ink-900);text-align:center;
    background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;
    padding:15px 16px;letter-spacing:.04em;transition:border-color .2s,background .2s;
  }
  .gate input::placeholder{color:var(--ink-400);letter-spacing:-.01em;}
  .gate input:focus{outline:none;background:var(--white);border-color:var(--blue);}
  .gate input.err{border-color:#f04452;background:#fff5f5;}
  .gate .msg{min-height:20px;margin-bottom:10px;font-size:13.5px;color:#f04452;font-weight:600;opacity:0;transition:opacity .2s;}
  .gate .msg.show{opacity:1;}
  .gate button{
    width:100%;padding:15px;background:var(--blue);color:#fff;border-radius:14px;
    font-size:16px;font-weight:700;letter-spacing:-.01em;transition:background .2s,transform .08s;
  }
  .gate button:hover{background:var(--blue-strong);}
  .gate button:active{transform:scale(.99);}
  @keyframes shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-5px);}40%,60%{transform:translateX(5px);}}
  .gate .field.shake{animation:shake .4s;}

  /* ── Header ──────────────────────────────────────────────── */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  .site .wrap{display:flex;align-items:center;gap:12px;height:60px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.03em;color:var(--ink-900);}
  .brand .mark{
    width:26px;height:26px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--blue),#4d9bff);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;
  }
  .brand small{font-weight:500;color:var(--ink-500);font-size:12px;letter-spacing:-.01em;margin-left:2px;}
  .site .spacer{flex:1;}
  .badge-open{
    display:none;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-700);
    background:var(--surface-2);padding:7px 12px;border-radius:999px;
  }
  .badge-open i{width:6px;height:6px;border-radius:50%;background:#12b886;display:block;}
  @media(min-width:600px){.badge-open{display:inline-flex;}}

  /* ── Hero ────────────────────────────────────────────────── */
  .hero{padding:56px 0 32px;}
  .hero h1{
    margin:0;font-size:34px;line-height:1.28;font-weight:800;letter-spacing:-.035em;color:var(--ink-900);
  }
  .hero h1 .accent{color:var(--blue);}
  .hero p{margin:14px 0 0;font-size:16px;color:var(--ink-700);max-width:30em;letter-spacing:-.015em;}
  .hero .count{
    margin-top:22px;display:inline-flex;align-items:baseline;gap:7px;
    font-size:14px;color:var(--ink-500);font-weight:500;
  }
  .hero .count b{font-size:15px;color:var(--ink-800);font-weight:700;font-variant-numeric:tabular-nums;}
  @media(min-width:720px){.hero{padding:72px 0 40px;} .hero h1{font-size:44px;}}

  /* ── Controls ────────────────────────────────────────────── */
  .controls{
    position:sticky;top:60px;z-index:40;background:var(--white);
    padding:12px 0 16px;
  }
  .controls-inner{display:flex;flex-direction:column;gap:14px;}
  @media(min-width:760px){.controls-inner{flex-direction:row;align-items:center;justify-content:space-between;gap:20px;}}

  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:stretch;min-width:0;}
  .fchip{
    padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;
    color:var(--ink-700);background:var(--surface-2);white-space:nowrap;
    transition:background .18s var(--ease),color .18s var(--ease);
  }
  .fchip:hover{background:var(--line);}
  .fchip[aria-pressed="true"]{background:var(--ink-900);color:#fff;}

  .search{position:relative;display:flex;align-items:center;min-width:0;flex:0 0 auto;}
  .search svg{position:absolute;left:14px;width:18px;height:18px;color:var(--ink-400);pointer-events:none;}
  .search input{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink-900);
    background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;
    padding:11px 14px 11px 40px;letter-spacing:-.01em;transition:border-color .2s,background .2s;
  }
  @media(min-width:760px){.search input{width:260px;}}
  .search input::placeholder{color:var(--ink-400);}
  .search input:focus{outline:none;background:var(--white);border-color:var(--blue);}

  /* ── Grid & cards ────────────────────────────────────────── */
  main{padding-bottom:80px;min-height:50vh;}
  .grid{display:grid;gap:20px 18px;grid-template-columns:1fr;}
  @media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:860px){.grid{grid-template-columns:repeat(3,1fr);}}

  .card{
    text-align:left;width:100%;background:var(--white);border:1px solid var(--line);
    border-radius:var(--radius-lg);overflow:hidden;transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:transparent;}
  .card:active{transform:translateY(-1px);}
  .thumb{position:relative;aspect-ratio:16/9;background:var(--surface-2);overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease);}
  .card:hover .thumb img{transform:scale(1.04);}
  .thumb .fallback{
    position:absolute;inset:0;display:none;place-items:center;
    background:linear-gradient(135deg,#eef2f7,#e2e8f0);
  }
  .thumb .fallback span{font-size:24px;font-weight:800;color:var(--ink-400);letter-spacing:-.03em;}
  .thumb.is-fallback img{display:none;}
  .thumb.is-fallback .fallback{display:grid;}
  .play{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);
    width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.94);
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(25,31,40,.18);
    opacity:0;transition:opacity .22s var(--ease),transform .22s var(--ease);
  }
  .card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .play svg{width:20px;height:20px;color:var(--blue);margin-left:2px;}

  .card-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1;}
  .chip{
    align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:-.01em;
    padding:4px 9px;border-radius:7px;color:var(--blue-strong);background:var(--blue-weak);
  }
  .card h3{margin:0;font-size:16px;font-weight:700;line-height:1.4;color:var(--ink-900);letter-spacing:-.02em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .desc{margin:0;font-size:13.5px;color:var(--ink-500);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .meta{margin-top:auto;padding-top:4px;font-size:13px;color:var(--ink-400);font-weight:500;font-variant-numeric:tabular-nums;}

  /* ── Skeleton ────────────────────────────────────────────── */
  .sk{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;}
  .sk .thumb{aspect-ratio:16/9;}
  .sk-line{height:12px;border-radius:6px;margin:0 16px;}
  .sk .b1{margin-top:16px;width:44px;height:20px;border-radius:7px;}
  .sk .b2{margin-top:12px;width:80%;}
  .sk .b3{margin-top:9px;width:55%;}
  .sk .b4{margin-top:14px;margin-bottom:18px;width:36%;height:11px;}
  .shimmer{background:linear-gradient(100deg,var(--surface-2) 30%,#eaedf0 50%,var(--surface-2) 70%);
    background-size:200% 100%;animation:sh 1.3s var(--ease) infinite;}
  @keyframes sh{from{background-position:200% 0;}to{background-position:-200% 0;}}

  /* ── States ──────────────────────────────────────────────── */
  .state{text-align:center;padding:72px 20px;max-width:400px;margin:0 auto;}
  .state .ico{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 18px;}
  .state .ico svg{width:26px;height:26px;color:var(--ink-400);}
  .state h2{margin:0 0 8px;font-size:18px;font-weight:700;color:var(--ink-800);letter-spacing:-.02em;}
  .state p{margin:0;font-size:14.5px;color:var(--ink-500);line-height:1.6;}
  .state button.retry{margin-top:20px;padding:11px 20px;background:var(--ink-900);color:#fff;border-radius:11px;font-weight:600;font-size:14px;transition:opacity .2s;}
  .state button.retry:hover{opacity:.88;}

  /* ── Demo banner ─────────────────────────────────────────── */
  .demo-banner{
    display:none;align-items:center;gap:10px;background:#fff8e6;border:1px solid #ffe8a3;
    color:#8a6d1a;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:500;line-height:1.5;margin-bottom:20px;
  }
  .demo-banner.show{display:flex;}
  .demo-banner svg{width:18px;height:18px;flex:0 0 auto;}
  .demo-banner b{font-weight:700;}

  /* ── Modal ───────────────────────────────────────────────── */
  .overlay{
    position:fixed;inset:0;z-index:100;background:rgba(15,19,25,.6);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;visibility:hidden;transition:opacity .24s var(--ease),visibility .24s;
    backdrop-filter:blur(2px);
  }
  .overlay.open{opacity:1;visibility:visible;}
  .modal{
    width:100%;max-width:860px;background:var(--white);border-radius:20px;overflow:hidden;
    box-shadow:var(--shadow-modal);transform:translateY(14px) scale(.98);transition:transform .28s var(--ease);
  }
  .overlay.open .modal{transform:none;}
  .modal .player{position:relative;aspect-ratio:16/9;background:#000;}
  .modal .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .modal .player .msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:8px;color:#c9ced6;padding:24px;}
  .modal .player .msg strong{color:#fff;font-size:16px;font-weight:700;}
  .modal .player .msg span{font-size:13.5px;}
  .modal-head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;}
  .modal-head h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.4;}
  .modal-head .m-date{margin:6px 0 0;font-size:13px;color:var(--ink-500);font-variant-numeric:tabular-nums;}
  .modal-close{
    flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--surface-2);
    display:grid;place-items:center;transition:background .2s;margin-left:auto;
  }
  .modal-close:hover{background:var(--line);}
  .modal-close svg{width:18px;height:18px;color:var(--ink-700);}

  /* ── Footer ──────────────────────────────────────────────── */
  footer.site{border-top:1px solid var(--line-soft);background:var(--surface);}
  footer .wrap{padding:32px 24px 40px;display:flex;flex-direction:column;gap:6px;}
  footer .fname{font-weight:700;font-size:15px;color:var(--ink-800);letter-spacing:-.02em;}
  footer .fmeta{font-size:13px;color:var(--ink-400);line-height:1.7;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  }
</style>
</head>
<body>

<!-- 비밀번호 잠금 화면 -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="g-mark">해</div>
    <h1>해법영어수학전문학원</h1>
    <p>원생 전용 강의실이에요.<br>비밀번호를 입력해 주세요.</p>
    <div class="field" id="gateField">
      <input id="gatePw" type="password" placeholder="비밀번호" autocomplete="off" aria-label="비밀번호" />
    </div>
    <div class="msg" id="gateMsg">비밀번호가 올바르지 않아요.</div>
    <button id="gateBtn">들어가기</button>
  </div>
</div>

<header class="site">
  <div class="wrap">
    <div class="brand">
      <span class="mark">해</span>
      해법영어수학전문학원
      <small>강의실</small>
    </div>
    <span class="spacer"></span>
    <span class="badge-open"><i></i> 원생 전용</span>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>다시 듣는 <span class="accent">해설강의</span>,<br>필요할 때 언제든.</h1>
    <p>원장님이 직접 촬영한 지문 해설과 녹음을 한곳에!<br>놓친 수업도, 시험 전 복습도 여기서</p>
    <div class="count" id="count" hidden>총 <b id="countNum">0</b>개 강의</div>
  </div>
</section>

<div class="controls">
  <div class="wrap controls-inner">
    <div class="chips" id="filter" role="group" aria-label="범주 선택"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="search" type="search" placeholder="지문 제목이나 강의 검색" autocomplete="off" aria-label="강의 검색" />
    </div>
  </div>
</div>

<main class="wrap">
  <div class="demo-banner" id="demoBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    <span><b>샘플 화면입니다.</b> 구글 시트를 연결하면 실제 강의 목록이 여기에 표시돼요. 연결 방법은 README를 참고하세요.</span>
  </div>

  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer class="site">
  <div class="wrap">
    <span class="fname">해법영어수학전문학원</span>
    <span class="fmeta">원생 전용 해설강의 다시보기 · 강의 문의는 041-908-0088</span>
  </div>
</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="player" id="player"></div>
    <div class="modal-head">
      <div>
        <span class="chip" id="mChip" hidden></span>
        <h3 id="mTitle"></h3>
        <p class="m-date" id="mDate"></p>
      </div>
      <button class="modal-close" id="mClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   해법영어수학전문학원 강의실 · 설정
   ─────────────────────────────────────────────────────────────────
   ▼ 여기만 고치면 됩니다.
   ──────────────────────────────────────────────────────────────── */
const CONFIG = {
  // 1) 구글 시트 "웹에 게시(CSV)" 주소
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT4wLLuzFCkShzwnefF5uda_YwHOswhk6pU3PHxFsTOCH8_kuFtte7jci1GywT9LkC2AjVaQA-pB-Qg/pub?output=csv",

  // 2) 접속 비밀번호  ← 바꾸려면 이 따옴표 안만 수정
  PASSWORD: "2026",

  // 3) 한 번 입력하면 다시 안 묻는 시간(시간 단위). 1일 = 24
  REMEMBER_HOURS: 24,
};

/* ── 샘플 데이터 (시트 미연결 시 화면 미리보기용) ───────────────── */
const DEMO = [
  { title:"중1 3과 · be동사와 일반동사 구분", date:"2025-03-04", category:"중1", desc:"문장에서 동사 자리를 먼저 찾는 법을 차근차근 짚습니다." },
  { title:"중2 중간고사 대비 · 4과 핵심 문법", date:"2025-03-02", category:"중2", desc:"시험에 꼭 나오는 포인트만 모아 정리했어요." },
  { title:"중3 기말 서술형 · 관계대명사 한 번에", date:"2025-02-27", category:"중3", desc:"헷갈리는 관계대명사를 예문으로 완전 정리." },
  { title:"중1 교과서 본문 해설 · 5과 전체", date:"2025-02-21", category:"중1", desc:"본문을 문장 단위로 끊어 읽으며 해석 연습." },
  { title:"중2 어법 · to부정사와 동명사 구분", date:"2025-02-18", category:"중2", desc:"동사마다 뭘 쓰는지 한눈에 정리." },
  { title:"중3 독해 · 장문 끊어 읽기 훈련", date:"2025-02-14", category:"중3", desc:"긴 지문도 시간 안에 읽어내는 연습." },
];

/* ── 유틸 ─────────────────────────────────────────────────────── */
function extractYouTubeId(raw){
  if(!raw) return "";
  const s = String(raw).trim();
  if(/^[\w-]{11}$/.test(s)) return s;            // 이미 순수 ID
  const m = s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : s;
}
function parseDate(str){
  if(!str) return 0;
  const t = String(str).trim().replace(/[.\/]/g,"-").replace(/-+/g,"-").replace(/-$/,"");
  const d = new Date(t);
  return isNaN(d) ? 0 : d.getTime();
}
function fmtDate(str){
  const ms = parseDate(str);
  if(!ms) return String(str||"").trim();
  const d = new Date(ms);
  return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}. ${String(d.getDate()).padStart(2,"0")}`;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* 따옴표·줄바꿈을 처리하는 CSV 파서 */
function parseCSV(text){
  const rows=[]; let row=[], field="", q=false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","){ row.push(field); field=""; }
      else if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x&&x.trim()!==""));
}
function mapHeader(h){
  const k=h.trim().toLowerCase();
  if(k.includes("제목")||k.includes("title")) return "title";
  if(k.includes("날짜")||k.includes("date")) return "date";
  if(k.includes("범주")||k.includes("분류")||k.includes("category")) return "category";
  if(k.includes("설명")||k.includes("메모")||k.includes("desc")) return "desc";
  if(k.includes("유튜브")||k.includes("youtube")||k.includes("영상")||k.includes("링크")||k.includes("url")||k.includes("id")) return "videoId";
  return null;
}
function rowsToItems(rows){
  if(!rows.length) return [];
  const keys = rows[0].map(mapHeader);
  return rows.slice(1).map(r=>{
    const o={title:"",date:"",category:"",videoId:"",desc:""};
    keys.forEach((k,i)=>{ if(k) o[k]=(r[i]||"").trim(); });
    return o;
  }).filter(o=>o.title || o.videoId);
}

/* ── 상태 ─────────────────────────────────────────────────────── */
let ALL=[], activeCat="all", query="", isDemo=false;
const grid=document.getElementById("grid");
const countEl=document.getElementById("count");
const filterEl=document.getElementById("filter");

/* ── 범주 칩 생성 ─────────────────────────────────────────────── */
function buildChips(){
  const cats=[];
  ALL.forEach(it=>{ if(it._cat && !cats.includes(it._cat)) cats.push(it._cat); });
  const html=['<button class="fchip" data-cat="all" aria-pressed="true">전체</button>']
    .concat(cats.map(c=>`<button class="fchip" data-cat="${esc(c)}" aria-pressed="false">${esc(c)}</button>`));
  filterEl.innerHTML=html.join("");
}

/* ── 렌더 ─────────────────────────────────────────────────────── */
function skeleton(){
  grid.innerHTML = Array.from({length:6}).map(()=>`
    <div class="sk">
      <div class="thumb shimmer"></div>
      <div class="sk-line b1 shimmer"></div>
      <div class="sk-line b2 shimmer"></div>
      <div class="sk-line b3 shimmer"></div>
      <div class="sk-line b4 shimmer"></div>
    </div>`).join("");
}

function render(){
  const q=query.trim().toLowerCase();
  const list = ALL.filter(it=>{
    const okCat = activeCat==="all" || it._cat===activeCat;
    const okQ = !q || (it.title+" "+it.desc).toLowerCase().includes(q);
    return okCat && okQ;
  });

  countEl.hidden=false;
  document.getElementById("countNum").textContent=ALL.length;

  if(!list.length){
    grid.innerHTML = `<div class="state" style="grid-column:1/-1">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></div>
      <h2>검색 결과가 없어요</h2>
      <p>다른 범주나 검색어로 다시 찾아보세요.</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map((it)=>{
    const id = it._id;
    const thumb = id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
    const initial = (it._cat||"·").slice(0,1);
    return `
    <button class="card" data-idx="${it._gi}">
      <div class="thumb${thumb?"":" is-fallback"}">
        ${thumb?`<img src="${thumb}" alt="" loading="lazy" onerror="this.parentNode.classList.add('is-fallback')">`:""}
        <div class="fallback"><span>${esc(initial)}</span></div>
        <div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="card-body">
        ${it._cat?`<span class="chip">${esc(it._cat)}</span>`:""}
        <h3>${esc(it.title)}</h3>
        ${it.desc?`<p class="desc">${esc(it.desc)}</p>`:""}
        <span class="meta">${esc(fmtDate(it.date))}</span>
      </div>
    </button>`;
  }).join("");
}

/* ── 필터 · 검색 ──────────────────────────────────────────────── */
filterEl.addEventListener("click",e=>{
  const btn=e.target.closest("button"); if(!btn) return;
  filterEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===btn?"true":"false"));
  activeCat=btn.dataset.cat;
  render();
});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render();});

/* ── 모달 ─────────────────────────────────────────────────────── */
const overlay=document.getElementById("overlay");
const player=document.getElementById("player");
let lastFocus=null;
function openModal(it){
  lastFocus=document.activeElement;
  document.getElementById("mTitle").textContent=it.title;
  document.getElementById("mDate").textContent=fmtDate(it.date);
  const mChip=document.getElementById("mChip");
  if(it._cat){ mChip.textContent=it._cat; mChip.hidden=false; } else { mChip.hidden=true; }

  if(it._id && !it._demo){
    player.innerHTML=`<iframe src="https://www.youtube.com/embed/${it._id}?rel=0&autoplay=1&modestbranding=1" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(it.title)}"></iframe>`;
  }else{
    player.innerHTML=`<div class="msg"><strong>샘플 강의예요</strong><span>구글 시트를 연결하면 실제 강의가 여기서 재생됩니다.</span></div>`;
  }
  overlay.classList.add("open");
  document.body.style.overflow="hidden";
  document.getElementById("mClose").focus();
}
function closeModal(){
  overlay.classList.remove("open");
  player.innerHTML="";
  document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}
grid.addEventListener("click",e=>{
  const card=e.target.closest(".card"); if(!card) return;
  openModal(ALL[+card.dataset.idx]);
});
document.getElementById("mClose").addEventListener("click",closeModal);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))closeModal();});

/* ── 오류 상태 ────────────────────────────────────────────────── */
function showError(){
  countEl.hidden=true;
  grid.innerHTML=`<div class="state" style="grid-column:1/-1">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
    <h2>강의를 불러오지 못했어요</h2>
    <p>인터넷 연결을 확인하거나, 구글 시트가 웹에 게시되어 있는지 다시 확인해 주세요.</p>
    <button class="retry" onclick="location.reload()">다시 시도</button>
  </div>`;
}

/* ── 데이터 적재 ──────────────────────────────────────────────── */
function prepare(items){
  return items
    .map(it=>({...it, _cat:(it.category||"").trim(), _id:extractYouTubeId(it.videoId), _demo:isDemo}))
    .sort((a,b)=>parseDate(b.date)-parseDate(a.date))
    .map((it,i)=>({...it, _gi:i}));
}
async function load(){
  skeleton();
  if(!CONFIG.SHEET_CSV_URL){
    isDemo=true;
    document.getElementById("demoBanner").classList.add("show");
    ALL=prepare(DEMO);
    setTimeout(()=>{ buildChips(); render(); },450);
    return;
  }
  try{
    const res=await fetch(CONFIG.SHEET_CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("fetch failed");
    const items=rowsToItems(parseCSV(await res.text()));
    if(!items.length){ isDemo=true; document.getElementById("demoBanner").classList.add("show"); ALL=prepare(DEMO); }
    else ALL=prepare(items);
    buildChips();
    render();
  }catch(err){ console.error(err); showError(); }
}

/* ── 비밀번호 잠금 ─────────────────────────────────────────────── */
const GATE_KEY="haebeop_unlock_at";
const gate=document.getElementById("gate");
const gatePw=document.getElementById("gatePw");
const gateBtn=document.getElementById("gateBtn");
const gateMsg=document.getElementById("gateMsg");
const gateField=document.getElementById("gateField");

function isUnlocked(){
  try{
    const t=parseInt(localStorage.getItem(GATE_KEY)||"",10);
    if(!t) return false;
    return (Date.now()-t) < (CONFIG.REMEMBER_HOURS||24)*3600*1000;
  }catch(e){ return false; }
}
function unlock(){
  gate.classList.add("hidden");
  document.body.style.overflow="";
  load();
}
function tryPassword(){
  if(gatePw.value === CONFIG.PASSWORD){
    try{ localStorage.setItem(GATE_KEY, String(Date.now())); }catch(e){}
    unlock();
  }else{
    gateMsg.classList.add("show");
    gatePw.classList.add("err");
    gateField.classList.remove("shake"); void gateField.offsetWidth; gateField.classList.add("shake");
    gatePw.select();
  }
}
gateBtn.addEventListener("click",tryPassword);
gatePw.addEventListener("keydown",e=>{ if(e.key==="Enter") tryPassword(); });
gatePw.addEventListener("input",()=>{ gateMsg.classList.remove("show"); gatePw.classList.remove("err"); });

/* ── 시작 ─────────────────────────────────────────────────────── */
if(isUnlocked()){
  gate.classList.add("hidden");
  load();
}else{
  document.body.style.overflow="hidden";
  gatePw.focus();
}
</script>
